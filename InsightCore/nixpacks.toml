[variables]
    NIXPACKS_DOTNET_SDK_VERSION = '10.0'
    ASPNETCORE_ENVIRONMENT = 'Production'

[phases.install]
    cmds = ['dotnet restore InsightCore/InsightCore.sln']

[phases.build]
    cmds = ['dotnet publish InsightCore/InsightCore.WebApi/InsightCore.WebApi.csproj -c Release -o out']

[start]
    cmd = 'dotnet out/InsightCore.WebApi.dll'